name: Docker Build and Publish

# The Jellyfin version is never configured in this repo - it is resolved from
# upstream at build time, and GHCR is the record of what has already been
# built. There is no version file to keep in sync.
on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]
  schedule:
    # Daily: publish a new Jellyfin release as soon as it appears upstream.
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Jellyfin version to build (default: newest stable upstream)"
        required: false
        type: string
      force:
        description: "Build even if this version is already published"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  OWNER: ${{ github.repository_owner }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      # The two images are independent: one failing must not cancel the other.
      fail-fast: false
      matrix:
        service: [jellyfin-rffmpeg-server, rffmpeg-worker]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Full history so the change detection below can diff against the
          # commit this push started from.
          fetch-depth: 0

      - name: Resolve Jellyfin version
        id: version
        run: |
          set -euo pipefail
          requested="${{ inputs.version }}"
          if [ -n "$requested" ]; then
            echo "Using requested version."
            version="$requested"
          else
            # Newest stable tag upstream. The regex drops rc/preview/unstable
            # and the dated per-build tags, leaving X.Y and X.Y.Z.
            version="$(curl -fsSL 'https://hub.docker.com/v2/repositories/jellyfin/jellyfin/tags?page_size=100&ordering=last_updated' \
              | jq -r '.results[].name' \
              | grep -E '^[0-9]+\.[0-9]+(\.[0-9]+)?$' \
              | sort -V | tail -n 1)"
          fi
          test -n "$version" || { echo "::error::could not resolve a Jellyfin version upstream"; exit 1; }
          echo "Jellyfin version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Decide whether to build
        id: decision
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if [ "${{ matrix.service }}" = "jellyfin-rffmpeg-server" ]; then
            package="jellyfin-rffmpeg-swarm-server"
          else
            package="jellyfin-rffmpeg-swarm-worker"
          fi

          # Has this version already been built? GHCR is the source of truth;
          # nothing about it is cached in the repo.
          published() {
            token="$(curl -fsSL "https://ghcr.io/token?scope=repository:${OWNER}/${package}:pull&service=ghcr.io" | jq -r .token)"
            code="$(curl -s -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${token}" \
              -H 'Accept: application/vnd.oci.image.index.v1+json' \
              -H 'Accept: application/vnd.docker.distribution.manifest.v2+json' \
              -H 'Accept: application/vnd.docker.distribution.manifest.list.v2+json' \
              "https://ghcr.io/v2/${OWNER}/${package}/manifests/${VERSION}")"
            [ "$code" = "200" ]
          }

          build=false
          reason=""

          case "${{ github.event_name }}" in
            push|pull_request)
              if [ "${{ github.event_name }}" = "pull_request" ]; then
                base="${{ github.event.pull_request.base.sha }}"
              else
                base="${{ github.event.before }}"
              fi

              # New branch, force push, or a base commit we no longer have.
              if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
                build=true
                reason="no usable base commit to diff against"
              else
                # No pipeline here on purpose: under pipefail, grep -q exiting
                # early on a match can leave git with SIGPIPE and flip the result.
                changed="$(git diff --name-only "$base" "${{ github.sha }}")"
                if grep -qE "^(${{ matrix.service }}/|\.github/workflows/docker-publish\.yml$)" <<<"$changed"; then
                  build=true
                  reason="code changed"
                else
                  reason="nothing affecting ${{ matrix.service }} changed"
                fi
              fi
              ;;

            schedule)
              if published; then
                reason="${VERSION} is already published"
              else
                build=true
                reason="${VERSION} is new upstream"
              fi
              ;;

            workflow_dispatch)
              if [ "${{ inputs.force }}" = "true" ]; then
                build=true
                reason="forced"
              elif published; then
                reason="${VERSION} is already published - re-run with force to rebuild"
              else
                build=true
                reason="${VERSION} is not published yet"
              fi
              ;;
          esac

          echo "${{ matrix.service }}: build=${build} (${reason})"
          echo "build=${build}" >> "$GITHUB_OUTPUT"
          echo "- ${{ matrix.service }} (Jellyfin ${VERSION}): ${reason}" >> "$GITHUB_STEP_SUMMARY"

      - name: Set image tags
        id: meta
        if: steps.decision.outputs.build == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if [ "${{ matrix.service }}" = "jellyfin-rffmpeg-server" ]; then
            image="ghcr.io/${OWNER}/jellyfin-rffmpeg-swarm-server"
          else
            image="ghcr.io/${OWNER}/jellyfin-rffmpeg-swarm-worker"
          fi

          # main -> :<version> + :latest, dev -> :<version>-dev + :dev.
          # The moving tag is what the compose files pull.
          if [ "${{ github.ref }}" = "refs/heads/dev" ]; then
            echo "tags=${image}:${VERSION}-dev,${image}:dev" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${image}:${VERSION},${image}:latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.decision.outputs.build == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: steps.decision.outputs.build == 'true' && github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: steps.decision.outputs.build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            JELLYFIN_VERSION=${{ steps.version.outputs.version }}
          # The layer cache lives in the Actions cache, so the prune below only
          # reclaims runner disk - it does not throw the cache away.
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Free runner disk
        if: always() && steps.decision.outputs.build == 'true'
        run: |
          docker buildx prune --all --force
          docker image prune -f
