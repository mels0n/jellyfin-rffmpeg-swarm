name: Docker Build and Publish

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]

# Grant the workflow token the permissions required to publish to GHCR
permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      # The two images are independent: one failing must not cancel the other.
      fail-fast: false
      matrix:
        service: [jellyfin-rffmpeg-server, rffmpeg-worker]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Full history so the change detection below can diff against the
          # commit this push started from.
          fetch-depth: 0

      - name: Load Jellyfin version
        run: |
          set -euo pipefail
          test -f versions.env || { echo "::error::versions.env is missing"; exit 1; }
          . ./versions.env
          test -n "${JELLYFIN_VERSION:-}" || { echo "::error::JELLYFIN_VERSION is not set in versions.env"; exit 1; }
          echo "JELLYFIN_VERSION=${JELLYFIN_VERSION}" >> "$GITHUB_ENV"

      - name: Decide whether to build
        id: decision
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            pull_request) base="${{ github.event.pull_request.base.sha }}" ;;
            push)         base="${{ github.event.before }}" ;;
            *)            base="" ;;
          esac

          # New branch, force push, or a base commit we no longer have: build.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "No usable base commit - building."
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # No pipeline here on purpose: under `pipefail`, grep -q exiting early
          # on a match can leave git with SIGPIPE and flip the result.
          changed="$(git diff --name-only "$base" "${{ github.sha }}")"
          if grep -qE "^(${{ matrix.service }}/|versions\.env$|\.github/workflows/docker-publish\.yml$)" <<<"$changed"; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing affecting ${{ matrix.service }} changed."
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set image tags
        id: meta
        if: steps.decision.outputs.build == 'true'
        run: |
          set -euo pipefail
          if [ "${{ matrix.service }}" = "jellyfin-rffmpeg-server" ]; then
            image="ghcr.io/mels0n/jellyfin-rffmpeg-swarm-server"
          else
            image="ghcr.io/mels0n/jellyfin-rffmpeg-swarm-worker"
          fi

          # main -> :<version> + :latest, dev -> :<version>-dev + :dev.
          # The moving tag is what the compose files pull.
          if [ "${{ github.ref }}" = "refs/heads/dev" ]; then
            echo "tags=${image}:${JELLYFIN_VERSION}-dev,${image}:dev" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${image}:${JELLYFIN_VERSION},${image}:latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.decision.outputs.build == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: steps.decision.outputs.build == 'true' && github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: steps.decision.outputs.build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            JELLYFIN_VERSION=${{ env.JELLYFIN_VERSION }}
          # The layer cache lives in the Actions cache, so the prune below only
          # reclaims runner disk - it does not throw the cache away.
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Free runner disk
        if: always() && steps.decision.outputs.build == 'true'
        run: |
          docker buildx prune --all --force
          docker image prune -f

      - name: Print status
        if: steps.decision.outputs.build != 'true'
        run: echo "No changes affecting ${{ matrix.service }}. Skipping build."
